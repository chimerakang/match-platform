name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpc:
    name: RPC conformance, faults, recovery and artifacts
    runs-on: [self-hosted, itype100-ci]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: rpc/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run cross-language and process acceptance
        run: |
          python -m pip install -r rpc/conformance/python/requirements.txt
          MATCH_PLATFORM_RPC_PYTHON=python bash tests/run_adapter_rpc_conformance.sh
      - name: Prove standalone reference dependency closure
        run: |
          cd rpc
          go build -o "$RUNNER_TEMP/counter-adapter" ./reference/counter/cmd/counter-adapter
          go version -m "$RUNNER_TEMP/counter-adapter" | tee "$RUNNER_TEMP/counter.modules"
          if grep -q 'github.com/chimerakang/hersir' "$RUNNER_TEMP/counter.modules"; then
            exit 1
          fi
      - name: Build immutable source, SBOM and provenance
        run: |
          version="${GITHUB_REF_NAME:-candidate}"
          python tools/build_release_artifacts.py \
            --output "$RUNNER_TEMP/match-platform-artifacts" --version "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: match-platform-${{ github.sha }}
          path: ${{ runner.temp }}/match-platform-artifacts/

  godot:
    name: Godot core and reference conformance
    runs-on: [self-hosted, itype100-ci]
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned Godot
        run: |
          command -v godot
          case "$(godot --version)" in
            4.6.1.stable.*) ;;
            *) exit 1 ;;
          esac
      - run: bash tests/run_godot_conformance.sh
